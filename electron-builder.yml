appId: com.deepseek.dsh
productName: DeepSeekHarness
electronDist: node_modules/electron/dist
directories:
  output: installer-dist
files:
  - main.js
  - desktop-behavior.js
  - preload.js
  - window-controls.html
  - loading.html
  - deepseek_whale_hermes_rounded.png
  - package.json
  - scripts/patch-harness-runtime.cjs
  - scripts/prepare-compile-cache.cjs
  - scripts/prepare-profile-prebundles.cjs
  - scripts/prebundle-runtime-startup.cjs
  - runtime/backend-spec.cjs
  - runtime/daemon-controller.cjs
  - runtime/daemon-host.cjs
  - runtime/plugin-recovery.cjs
extraResources:
  - from: bundle/dsh-runtime/package.json
    to: dsh-runtime/package.json
  - from: bundle/dsh-runtime/node_modules
    to: dsh-runtime/node_modules
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/*.d.mts"
      - "!**/*.d.cts"
      - "!**/*.ts"
      - "!**/*.tsx"
      - "!**/*.pdb"
      - "!**/win32-arm64/**"
      - "!**/win10-arm64/**"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/fixture/**"
      - "!**/fixtures/**"
      - "!**/doc/**"
      - "!**/docs/**"
      - "!**/example/**"
      - "!**/examples/**"
      - "!**/*.md"
      - "!**/*.markdown"
  - from: bundle/node-compile-cache
    to: node-compile-cache
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: deepseek_whale_hermes_rounded.ico
electronVersion: 43.4.0
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
artifactName: DeepSeekHarness-Setup-${version}.${ext}
publish:
  - provider: github
    owner: Links2008
    repo: DeepSeek-Harness-Desktop
    releaseType: release
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  useZip: false
  differentialPackage: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  installerIcon: deepseek_whale_hermes_rounded.ico
  uninstallerIcon: deepseek_whale_hermes_rounded.ico
  deleteAppDataOnUninstall: false
