<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; --ease-out: cubic-bezier(.23, 1, .32, 1); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; }
    .controls { display: flex; gap: 0; }
    button {
      width: 16px; height: 18px; padding: 0; border: 0; border-radius: 9px;
      position: relative; display: grid; place-items: center; background: transparent;
      color: rgba(25,25,25,.76); cursor: pointer; touch-action: none;
      font: 700 7px/1 "Segoe UI Symbol", sans-serif;
    }
    button::before {
      content: ""; position: absolute; left: 50%; top: 50%; border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%);
    }
    button::before {
      width: 10px; height: 10px; background: var(--dot-color);
      box-shadow: 0 1px 2px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.08);
      transition: transform 90ms var(--ease-out), filter 90ms ease, box-shadow 90ms ease;
    }
    [data-action="close"] { --dot-color: #ff5f57; }
    [data-action="min"] { --dot-color: #febc2e; }
    [data-action="max"] { --dot-color: #28c840; }
    .glyph {
      position: absolute; z-index: 2; left: 50%; top: 50%; opacity: 0;
      transform: translate(-50%, -50%) scale(.88);
      transition: opacity 120ms ease, transform 160ms var(--ease-out);
    }
    button.pressed::before { transform: translate(-50%, -50%) scale(.84); filter: brightness(.82); }
    button:focus-visible { outline: 1px solid rgba(255,255,255,.82); outline-offset: -1px; }
    [data-action="max"] .restore { display: none; }
    body.maximized [data-action="max"] .maximize { display: none; }
    body.maximized [data-action="max"] .restore { display: inline; }
    @media (hover: hover) and (pointer: fine) {
      button:hover::before { filter: brightness(1.08); box-shadow: 0 1px 3px rgba(0,0,0,.34); }
      .controls:hover .glyph { opacity: .78; transform: translate(-50%, -50%) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      button::before, .glyph { transition-duration: 0ms; }
      button.pressed::before { transform: translate(-50%, -50%); filter: brightness(.78); }
    }
  </style>
</head>
<body>
  <div class="controls" role="group" aria-label="窗口控制">
    <button data-action="close" title="关闭" aria-label="关闭"><span class="glyph">&#215;</span></button>
    <button data-action="min" title="最小化" aria-label="最小化"><span class="glyph">&#8722;</span></button>
    <button data-action="max" title="最大化/还原" aria-label="最大化/还原"><span class="glyph maximize">&#8599;</span><span class="glyph restore">&#8601;</span></button>
  </div>
  <script>
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const controls = document.querySelector('.controls');

    const buttonFrom = (event) => event.target.closest('[data-action]');
    const press = (button, pointerId) => {
      if (!button) return;
      button.classList.add('pressed');
      if (pointerId !== undefined) button.setPointerCapture?.(pointerId);
    };
    const release = (button) => {
      if (!button) return;
      button.classList.remove('pressed');
    };

    controls.addEventListener('pointerdown', (event) => press(buttonFrom(event), event.pointerId));
    controls.addEventListener('pointerup', (event) => release(buttonFrom(event)));
    controls.addEventListener('pointercancel', (event) => release(buttonFrom(event)));
    controls.addEventListener('lostpointercapture', (event) => release(buttonFrom(event)));

    controls.addEventListener('click', (event) => {
      const button = buttonFrom(event);
      if (!button || !window.dshWin) return;
      release(button);
      window.dshWin[button.dataset.action]({ reducedMotion });
    });
  </script>
</body>
</html>
