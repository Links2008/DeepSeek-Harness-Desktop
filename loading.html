<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: grid; place-items: center;
      background: #121214; color: #f0f0f2;
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    main { display: grid; justify-items: center; gap: 22px; text-align: center; }
    /* v3.1.3：丝滑品牌动画——渐入 + 呼吸 + 波纹 */
    .brand { position: relative; width: 88px; height: 88px; opacity: 0; animation: brandIn 700ms cubic-bezier(.22,1,.36,1) 100ms forwards; }
    .brand img { width: 88px; height: 88px; filter: drop-shadow(0 0 12px rgba(125,140,255,.25)); }
    .brand::before, .brand::after {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid rgba(125,140,255,.35); opacity: 0;
      animation: ripple 2.4s ease-out infinite;
    }
    .brand::after { animation-delay: 1.2s; }
    @keyframes brandIn {
      from { opacity: 0; transform: scale(.88) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes ripple {
      0%   { opacity: .55; transform: scale(.82); }
      100% { opacity: 0; transform: scale(1.45); }
    }
    .copy { display: grid; gap: 6px; opacity: 0; animation: fadeUp 600ms ease 350ms forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    [data-status] { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
    [data-detail] { color: #9b9ba3; font-size: 13px; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid #303036; border-top-color: #7d8cff;
      border-radius: 50%; animation: spin 700ms linear infinite;
      opacity: 0; animation: spin 700ms linear infinite, fadeUp 400ms ease 600ms forwards;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .brand, .copy, .spinner { animation: none !important; opacity: 1; }
      .brand::before, .brand::after { display: none; }
      .spinner { border-color: #7d8cff; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="deepseek_whale_hermes_rounded.png" alt="DeepSeek Harness">
    </div>
    <div class="copy">
      <p data-status>正在启动 DeepSeek Harness</p>
      <p data-detail>首次启动可能需要约一分钟</p>
    </div>
    <div class="spinner" aria-label="正在加载"></div>
  </main>
</body>
</html>
