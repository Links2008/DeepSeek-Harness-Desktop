<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在启动 DeepSeek Harness</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid; place-items: center; background: #121214; color: #f0f0f2;
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    main { display: grid; justify-items: center; gap: 18px; text-align: center; }
    img { width: 72px; height: 72px; }
    .copy { display: grid; gap: 5px; }
    [data-status] { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    [data-detail] { margin: 0; color: #9b9ba3; font-size: 13px; }
    .spinner {
      width: 20px; height: 20px; border: 2px solid #303036; border-top-color: #7d8cff;
      border-radius: 50%; animation: spin 800ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-color: #7d8cff; } }
  </style>
</head>
<body>
  <main>
    <img src="deepseek_whale_hermes_rounded.png" alt="">
    <div class="copy">
      <p data-status>正在启动 DeepSeek Harness</p>
      <p data-detail>首次启动可能需要约一分钟</p>
    </div>
    <div class="spinner" aria-label="正在加载"></div>
  </main>
</body>
</html>
